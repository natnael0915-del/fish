<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Zone Manager</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1b2430;--muted:#667085;--line:#e3e8ee;--brand:#0f766e;--brand-ink:#fff;--brand-soft:#d9f2ee;--warn:#b45309;--warn-soft:#fef3c7;--bad:#b42318;--bad-soft:#fee4e2;--good:#067647;--good-soft:#dcfae6;--rev:#0f766e;--exp:#d97706;--radius:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0e141b;--card:#16202b;--ink:#e8edf3;--muted:#93a1b2;--line:#263445;--brand:#2dd4bf;--brand-ink:#062b27;--brand-soft:#0f3a37;--warn-soft:#3b2a0b;--bad-soft:#3d1511;--good-soft:#0c3322;--warn:#fbbf24;--bad:#f97066;--good:#4ade80;--rev:#2dd4bf;--exp:#fbbf24}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{margin:0 0 .5rem;line-height:1.2}h2{font-size:1.15rem}h3{font-size:1rem;color:var(--muted);font-weight:600}
a{color:var(--brand)}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.topbar .logo{font-weight:800}.topbar .who{margin-left:auto;text-align:right;font-size:.85rem;color:var(--muted)}
.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--line);scrollbar-width:none}
.nav button{flex:none;background:none;border:0;padding:8px 14px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:600}.nav button.on{background:var(--brand-soft);color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.gst{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sb{justify-content:space-between}
.muted{color:var(--muted)}.small{font-size:.85rem}.right{text-align:right}.nowrap{white-space:nowrap}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.kpi .l{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.kpi .v{font-size:1.5rem;font-weight:750;margin-top:2px}.kpi .s{font-size:.8rem;color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
label{display:block;font-size:.85rem;color:var(--muted);margin:10px 0 4px;font-weight:600}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px}
.inline input,.inline select{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:650;min-height:42px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn.sm{padding:5px 10px;min-height:30px;font-size:.85rem}.btn.block{width:100%}.btn:disabled{opacity:.5;cursor:not-allowed}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.void td{text-decoration:line-through;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.gray{background:var(--line);color:var(--muted)}
.station{border:1px solid var(--line);border-radius:var(--radius);padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px}
.station.busy{border-color:var(--brand);background:var(--brand-soft)}.station .timer{font-size:1.6rem;font-weight:750;font-variant-numeric:tabular-nums}
.bar-row{display:grid;grid-template-columns:130px 1fr 90px;gap:8px;align-items:center;margin:6px 0;font-size:.9rem}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px}.bar.exp>i{background:var(--exp)}
.chart{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:8px;overflow-x:auto}
.chart .col{flex:1 0 22px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:22px}
.chart .pair{display:flex;align-items:flex-end;gap:2px;height:130px}.chart .pair i{display:block;width:9px;border-radius:3px 3px 0 0;min-height:1px}
.chart .pair i.r{background:var(--rev)}.chart .pair i.e{background:var(--exp)}.chart .d{font-size:.65rem;color:var(--muted);margin-top:4px}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted)}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:90vw}.toast.err{background:var(--bad);color:#fff}
.login{max-width:380px;margin:10vh auto;padding:0 16px}.login h1{font-size:1.6rem;margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:24px}
.err-box{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;margin-bottom:10px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;font-size:.8rem;max-height:340px}
code{background:var(--bg);padding:1px 5px;border-radius:5px}
@media (max-width:600px){.bar-row{grid-template-columns:90px 1fr 80px}main{padding:12px}}
</style>
</head>
<body>
<div id="app"><p style="padding:20px">Loading…</p></div>

<script type="module">
/* =====================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (Firebase console > Project settings
      > Your apps > Web app > "firebaseConfig"). See SETUP steps in the app.
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBz_tReSaYYxl8TG6Ri3C7iWvtrpM5Q0l0",
  authDomain: "fish-2e788.firebaseapp.com",
  projectId: "fish-2e788",
  storageBucket: "fish-2e788.firebasestorage.app",
  messagingSenderId: "300814262964",
  appId: "1:300814262964:web:3c6c427820e95f99402de1"
};

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() {
      return request.auth != null
        && exists(/databases/$(database)/documents/users/$(request.auth.uid))
        && get(/databases/$(database)/documents/users/$(request.auth.uid)).data.active == true;
    }
    function me() { return get(/databases/$(database)/documents/users/$(request.auth.uid)).data; }
    function isAdmin() { return signedIn() && me().role == 'admin'; }
    function isCashier() { return signedIn() && me().role == 'cashier'; }
    function onlyChanges(keys) { return request.resource.data.diff(resource.data).affectedKeys().hasOnly(keys); }

    match /users/{u} {
      allow read: if request.auth != null && (request.auth.uid == u || isAdmin());
      allow create: if isAdmin() || (request.auth != null && request.auth.uid == u
                    && request.resource.data.role == 'admin'
                    && !exists(/databases/$(database)/documents/settings/main));
      allow update: if isAdmin() || (request.auth != null && request.auth.uid == u && onlyChanges(['mustChange']));
    }
    match /settings/{d} { allow read: if true; allow write: if isAdmin(); }
    match /branches/{d} { allow read: if signedIn(); allow write: if isAdmin(); }
    match /games/{d}    { allow read: if signedIn(); allow write: if isAdmin(); }
    match /stations/{d} { allow read: if signedIn(); allow write: if isAdmin(); }

    match /shifts/{s} {
      allow read: if isAdmin() || (isCashier() && resource.data.cashierId == request.auth.uid);
      allow create: if isCashier() && request.resource.data.cashierId == request.auth.uid
                    && request.resource.data.branchId == me().branchId && request.resource.data.status == 'open';
      allow update: if isAdmin() || (isCashier() && resource.data.cashierId == request.auth.uid
                    && resource.data.status == 'open' && request.resource.data.cashierId == request.auth.uid
                    && request.resource.data.branchId == resource.data.branchId);
    }
    match /live/{s} {
      allow get: if isAdmin() || (isCashier() && (resource == null || resource.data.branchId == me().branchId));
      allow list: if isAdmin() || (isCashier() && resource.data.branchId == me().branchId);
      allow create: if isCashier() && request.resource.data.branchId == me().branchId
                    && request.resource.data.cashierId == request.auth.uid;
      allow delete: if isAdmin() || (isCashier() && resource.data.branchId == me().branchId);
    }
    match /sales/{s} {
      allow read: if isAdmin() || (isCashier() && resource.data.cashierId == request.auth.uid);
      allow create: if isCashier() && request.resource.data.cashierId == request.auth.uid
                    && request.resource.data.branchId == me().branchId;
      allow update: if isAdmin() || (isCashier() && resource.data.cashierId == request.auth.uid
                    && resource.data.voided == false && onlyChanges(['voided','voidReason']));
    }
    match /expenses/{s} {
      allow read: if isAdmin() || (isCashier() && resource.data.userId == request.auth.uid);
      allow create: if isAdmin() || (isCashier() && request.resource.data.userId == request.auth.uid
                    && request.resource.data.branchId == me().branchId);
      allow update: if isAdmin() || (isCashier() && resource.data.userId == request.auth.uid
                    && resource.data.voided == false && onlyChanges(['voided']));
    }
    match /audit/{a} {
      allow read: if isAdmin();
      allow create: if signedIn() && request.resource.data.userId == request.auth.uid;
    }
  }
}`;

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword,
         updatePassword, reauthenticateWithCredential, EmailAuthProvider, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc, query, where, runTransaction }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $app = document.getElementById('app');
{ const rc = Element.prototype.replaceChildren; Element.prototype.replaceChildren = function (...k) { return rc.apply(this, k.filter((x) => x !== null && x !== undefined && x !== false)); }; }

// ---------- tiny DOM helpers ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'value') el.value = v;
    else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = !!v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  const add = (c) => { if (Array.isArray(c)) return c.forEach(add); if (c === null || c === undefined || c === false) return; el.append(c.nodeType ? c : document.createTextNode(String(c))); };
  kids.forEach(add);
  return el;
}
const S = { user: null, cfg: null, branches: [], games: [], stations: [], tab: null, booting: false };
const DEFAULT_CFG = { currency: 'KES', paymentMethods: ['Cash', 'M-Pesa', 'Other'], expenseCategories: ['Rent', 'Electricity', 'Internet', 'Salaries', 'Repairs & Maintenance', 'Supplies', 'Prize Payout', 'Transport', 'Other'] };
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayStr = (off = 0) => ymd(new Date(Date.now() + off * 864e5));
const dayMs = (s) => new Date(s + 'T00:00:00').getTime();
const fmt = (n) => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: 2 });
const money = (n) => `${fmt(n)} ${S.cfg ? S.cfg.currency : ''}`.trim();
const fmtTime = (ms) => new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDT = (ms) => new Date(ms).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
const num = (v) => (v === '' || v === null || v === undefined ? NaN : Number(v));
const r2 = (n) => Math.round((n + Number.EPSILON) * 100) / 100;
const isCash = (m) => String(m).toLowerCase() === 'cash';
const clean = (v, max = 100) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
const byName = (a, b) => String(a.name).localeCompare(String(b.name));

function toast(msg, isErr) { const t = h('div', { class: 'toast' + (isErr ? ' err' : '') }, msg); document.body.append(t); setTimeout(() => t.remove(), isErr ? 5000 : 2200); }
const friendly = (e) => {
  const c = e && e.code || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found') || c.includes('invalid-email')) return 'Wrong username or password';
  if (c.includes('too-many-requests')) return 'Too many attempts. Wait a few minutes and try again.';
  if (c.includes('email-already-in-use')) return 'That username/email is already taken';
  if (c.includes('weak-password')) return 'Password must be at least 6 characters';
  if (c.includes('permission-denied')) return 'Not allowed. Check that the Firestore rules were published.';
  if (c.includes('network')) return 'No internet connection';
  return (e && e.message) || String(e);
};
const fail = (e) => { console.error(e); toast(friendly(e), true); };
function modal(title, content, opts = {}) {
  const close = () => bg.remove();
  const bg = h('div', { class: 'modal-bg', onclick: (e) => { if (e.target === bg && !opts.sticky) close(); } }, h('div', { class: 'modal' }, h('h2', {}, title), content));
  document.body.append(bg); const f = bg.querySelector('input,select'); if (f) f.focus(); return close;
}
const field = (label, input) => h('div', {}, h('label', {}, label), input);
function select(options, value, attrs) {
  return h('select', attrs, options.map((o) => { const [v, t] = Array.isArray(o) ? o : [o, o]; return h('option', { value: v, selected: String(v) === String(value) }, t); }));
}
async function guarded(btn, fn) { btn.disabled = true; try { await fn(); } catch (e) { fail(e); } finally { btn.disabled = false; } }
function confirmBox(title, text, okLabel, onOk, danger) {
  const ok = h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => guarded(ok, async () => { await onOk(); close(); }) }, okLabel);
  const close = modal(title, h('div', {}, h('p', {}, text), h('div', { class: 'row', style: 'justify-content:flex-end' }, h('button', { class: 'btn', onclick: () => close() }, 'Cancel'), ok)));
}
function reasonBox(title, onSubmit) {
  const reason = h('input', { placeholder: 'Reason (required)', maxlength: 200 });
  const ok = h('button', { class: 'btn danger', onclick: () => guarded(ok, async () => { if (!clean(reason.value, 200)) throw new Error('A reason is required'); await onSubmit(clean(reason.value, 200)); close(); }) }, 'Confirm');
  const close = modal(title, h('div', {}, field('Reason', reason), h('div', { class: 'row', style: 'justify-content:flex-end;margin-top:12px' }, h('button', { class: 'btn', onclick: () => close() }, 'Cancel'), ok)));
}
const kpi = (label, value, sub, cls) => h('div', { class: 'kpi' }, h('div', { class: 'l' }, label), h('div', { class: 'v ' + (cls || '') }, value), sub ? h('div', { class: 's' }, sub) : null);

// ---------- setup guide (shown until the config above is filled in) ----------
const configured = !String(FIREBASE_CONFIG.apiKey).startsWith('PASTE');
if (!configured) {
  const copy = h('button', { class: 'btn sm', onclick: () => navigator.clipboard.writeText(RULES).then(() => toast('Rules copied')) }, 'Copy rules');
  $app.replaceChildren(h('main', {}, h('div', { class: 'card' },
    h('h1', {}, 'Game Zone Manager: one-time setup'),
    h('p', { class: 'muted' }, 'This page needs your Firebase project details. Do these steps once:'),
    h('ol', {},
      h('li', {}, 'Go to ', h('b', {}, 'console.firebase.google.com'), ' → Add project (any name; Analytics not needed).'),
      h('li', {}, 'Build → ', h('b', {}, 'Authentication'), ' → Get started → enable ', h('b', {}, 'Email/Password'), '.'),
      h('li', {}, 'Build → ', h('b', {}, 'Firestore Database'), ' → Create database → choose a nearby region → start in ', h('b', {}, 'production mode'), '.'),
      h('li', {}, 'Firestore → ', h('b', {}, 'Rules'), ' tab → delete everything → paste the rules below → ', h('b', {}, 'Publish'), '.'),
      h('li', {}, 'Project settings (gear icon) → Your apps → click the ', h('b', {}, '</>'), ' Web icon → register → copy the ', h('code', {}, 'firebaseConfig'), ' values.'),
      h('li', {}, 'Open ', h('code', {}, 'index.html'), ', replace the 4 values in ', h('code', {}, 'FIREBASE_CONFIG'), ' at the top of the script, and save/upload it again.'),
      h('li', {}, 'After publishing to GitHub Pages: Authentication → Settings → ', h('b', {}, 'Authorized domains'), ' → add ', h('code', {}, 'YOURNAME.github.io'), '.'),
      h('li', {}, 'Open the page. The first screen will ask you to create the owner (admin) account.')),
    h('div', { class: 'row sb' }, h('h3', {}, 'Firestore rules'), copy), h('pre', {}, RULES))));
  throw new Error('Firebase not configured yet');
}

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getFirestore(app);
let secondaryApp = null;

// ---------- data helpers ----------
const C = (n) => collection(db, n);
const D = (n, id) => doc(db, n, id);
async function qlist(n, ...c) { const s = await getDocs(query(C(n), ...c)); return s.docs.map((d) => ({ id: d.id, ...d.data() })); }
async function audit(action, detail = '') { try { await addDoc(C('audit'), { userId: S.user.id, userName: S.user.name, action, detail: String(detail).slice(0, 300), createdAt: Date.now() }); } catch (e) { console.warn(e); } }
async function loadStatic() {
  const [branches, games, stations, st] = await Promise.all([qlist('branches'), qlist('games'), qlist('stations'), getDoc(D('settings', 'main'))]);
  S.branches = branches.sort(byName); S.games = games.sort(byName); S.stations = stations.sort(byName);
  S.cfg = { ...DEFAULT_CFG, ...(st.exists() ? st.data() : {}) };
}
const branchName = (id) => (S.branches.find((b) => b.id === id) || {}).name || '?';
const gameOf = (id) => S.games.find((g) => g.id === id);

// ---------- auth ----------
const toEmail = (u) => { u = clean(u, 80).toLowerCase(); return u.includes('@') ? u : `${u}@gamezone.app`; };
async function doLogout() { S.user = null; S.tab = null; clearInterval(S.tick); await signOut(auth); }

onAuthStateChanged(auth, async (u) => {
  if (S.booting) return;
  if (!u) { renderLogin(); return; }
  try {
    const snap = await getDoc(D('users', u.uid));
    if (!snap.exists() || !snap.data().active) { await signOut(auth); renderLogin('This account is disabled or not set up. Contact the admin.'); return; }
    S.user = { id: u.uid, ...snap.data() };
    await loadStatic();
    S.user.mustChange ? renderChangePassword(true) : render();
  } catch (e) { console.error(e); renderLogin(friendly(e)); }
});

async function renderLogin(msg) {
  const un = h('input', { placeholder: 'Username (or email)', autocomplete: 'username', autocapitalize: 'none' });
  const pw = h('input', { type: 'password', placeholder: 'Password', autocomplete: 'current-password' });
  const btn = h('button', { class: 'btn primary block', style: 'margin-top:16px' }, 'Log in');
  const go = () => guarded(btn, async () => { try { await signInWithEmailAndPassword(auth, toEmail(un.value), pw.value); } catch (e) { throw new Error(friendly(e)); } });
  btn.onclick = go; pw.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  const holder = h('div', {});
  $app.replaceChildren(h('div', { class: 'login' }, h('h1', {}, '🎮 Game Zone Manager'), h('p', { class: 'muted' }, 'Log in to continue'), msg ? h('div', { class: 'err-box' }, msg) : null, holder,
    h('div', { class: 'card' }, field('Username', un), field('Password', pw), btn)));
  try {
    const st = await getDoc(D('settings', 'main'));
    if (!st.exists()) holder.append(h('div', { class: 'card' }, h('b', {}, 'First time here?'), h('p', { class: 'muted small' }, 'No owner account exists yet.'), h('button', { class: 'btn block', onclick: renderBootstrap }, 'Create the owner (admin) account')));
  } catch (e) { holder.append(h('div', { class: 'err-box' }, 'Cannot reach the database: ' + friendly(e))); }
}
function renderBootstrap() {
  const name = h('input', { placeholder: 'Your name' }); const email = h('input', { type: 'email', placeholder: 'you@example.com', autocapitalize: 'none' });
  const pw = h('input', { type: 'password', placeholder: 'min 6 characters' }); const cur = h('input', { value: DEFAULT_CFG.currency, maxlength: 8 });
  const btn = h('button', { class: 'btn primary block', style: 'margin-top:14px' }, 'Create owner account');
  btn.onclick = () => guarded(btn, async () => {
    if (!clean(name.value) || !email.value.includes('@')) throw new Error('Enter your name and a valid email');
    S.booting = true;
    try {
      const em = clean(email.value, 120).toLowerCase(); let cred;
      try { cred = await createUserWithEmailAndPassword(auth, em, pw.value); }
      catch (e) { if (e && e.code === 'auth/email-already-in-use') cred = await signInWithEmailAndPassword(auth, em, pw.value); else throw e; } // retry after an earlier failed attempt
      await setDoc(D('users', cred.user.uid), { name: clean(name.value, 80), username: clean(email.value, 120).toLowerCase(), email: clean(email.value, 120).toLowerCase(), role: 'admin', branchId: null, active: true, mustChange: false, createdAt: Date.now() });

async function currentShift() { const r = await qlist('shifts', where('cashierId', '==', S.user.id), where('status', '==', 'open')); return r[0] || null; }
async function shiftData(shift) {
  const [sales, exps] = await Promise.all([qlist('sales', where('cashierId', '==', S.user.id), where('shiftId', '==', shift.id)), qlist('expenses', where('userId', '==', S.user.id), where('shiftId', '==', shift.id))]);
  sales.sort((a, b) => b.createdAt - a.createdAt); exps.sort((a, b) => b.createdAt - a.createdAt);
  return { sales, exps, totals: totalsFor(shift, sales, exps) };
}
function totalsFor(shift, sales, exps) {
  const sv = sales.filter((s) => !s.voided), ev = exps.filter((e) => !e.voided);
  const group = (arr, key) => { const m = {}; arr.forEach((x) => { m[x[key]] = (m[x[key]] || 0) + x.amount; }); return Object.entries(m).map(([method, total]) => ({ method, total: r2(total) })); };
  const cashSales = sv.filter((s) => isCash(s.method)).reduce((a, s) => a + s.amount, 0);
  const cashExp = ev.filter((e) => isCash(e.paidFrom)).reduce((a, e) => a + e.amount, 0);
  return { salesByMethod: group(sv, 'method'), expByMethod: group(ev, 'paidFrom'), salesTotal: r2(sv.reduce((a, s) => a + s.amount, 0)), expTotal: r2(ev.reduce((a, e) => a + e.amount, 0)), expectedCash: r2(shift.openingCash + cashSales - cashExp) };
}
function billing(minElapsed, rate, inc) { const m = Math.max(1, minElapsed); const billed = Math.ceil(m / inc) * inc; return { billed, amount: r2((billed / 60) * rate) }; }
