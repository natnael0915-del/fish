<style>

.hero{text-align:center;margin-bottom:18px}.hero .big{font:700 2.6rem var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}

.floating-tools{position:fixed;top:12px;right:12px;z-index:6}.floating-tools .tools button{background:var(--card);border-color:var(--line);color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:26px}
.err-box{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:12px;margin-bottom:10px}
.warn-box{background:var(--warn-soft);color:var(--warn);padding:10px 12px;border-radius:12px;margin-bottom:14px;font-weight:600}
pre{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px;overflow:auto;font-size:.8rem;max-height:340px}
code{background:var(--bg2);padding:1px 6px;border-radius:6px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

</style>

function capturePhoto(meta) {
  return new Promise((resolve) => {
    let stream = null; let done = false;
    const video = h('video', { class: 'cam', autoplay: true, playsinline: true }); video.muted = true;
    const msg = h('p', { class: 'muted small' }, 'Point the camera at the machine, then press the button. The exact time is printed on the photo.');
    const shot = h('button', { class: 'btn primary block', style: 'margin-top:10px', disabled: true }, '📷 Take photo');
    const finish = (r) => { if (done) return; done = true; if (stream) stream.getTracks().forEach((t) => t.stop()); close(); resolve(r); };
    const close = modal('Take a photo', h('div', {}, msg, video, shot, h('button', { class: 'btn block', style: 'margin-top:8px', onclick: () => finish(null) }, 'Cancel')), { sticky: true });
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { msg.className = 'err-box'; msg.textContent = 'This browser cannot open the camera. Use Chrome or Safari over https.'; }
    else navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false })
      .then((s) => { if (done) { s.getTracks().forEach((t) => t.stop()); return; } stream = s; video.srcObject = s; video.play().catch(() => {}); shot.disabled = false; })
      .catch((e) => { msg.className = 'err-box'; msg.textContent = e && e.name === 'NotAllowedError' ? 'Camera blocked. Allow camera access for this site in your browser settings, then try again.' : 'Camera not available: ' + (e && e.message || e); });
    shot.onclick = () => {
      const w = video.videoWidth, vh = video.videoHeight; if (!w || !vh) return toast('Camera is not ready yet', true);
      const takenAt = Date.now(); const sc = Math.min(1, 1024 / w); const cw = Math.round(w * sc), ch = Math.round(vh * sc);
      const cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; const ctx = cv.getContext('2d'); ctx.drawImage(video, 0, 0, cw, ch);
      const d = new Date(takenAt); const stamp = `${pad(d.getDate())} ${d.toLocaleString('en', { month: 'short' })} ${d.getFullYear()}   ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const lines = [stamp, [meta.branch, meta.cashier].filter(Boolean).join('  ·  '), meta.label].filter(Boolean);
      const fs = Math.max(14, Math.round(cw / 30)); const lh = fs * 1.35; const barH = lh * lines.length + fs * 0.5;
      ctx.fillStyle = 'rgba(0,0,0,.68)'; ctx.fillRect(0, ch - barH, cw, barH); ctx.textBaseline = 'top';
      lines.forEach((l, i) => { ctx.font = `${i === 0 ? '700' : '600'} ${fs}px system-ui,sans-serif`; ctx.fillStyle = i === 0 ? '#ffd23f' : '#ffffff'; ctx.fillText(l, fs * 0.5, ch - barH + fs * 0.35 + i * lh); });
      const img = cv.toDataURL('image/jpeg', 0.72);
      const tc = document.createElement('canvas'); tc.width = 240; tc.height = Math.round((240 * ch) / cw); tc.getContext('2d').drawImage(cv, 0, 0, tc.width, tc.height);
      finish({ img, thumb: tc.toDataURL('image/jpeg', 0.6), takenAt, label: meta.label || '' });
    };
  });
}

const toEmail = (u) => { u = clean(u, 80).toLowerCase(); return u.includes('@') ? u : `${u}@gamezone.app`; };

onAuthStateChanged(auth, async (u) => {
  if (S.booting) return;
  if (!u) { renderLogin(); return; }
  try {
    const snap = await getDoc(D('users', u.uid));

async function currentShift() { const r = await qlist('shifts', where('cashierId', '==', S.user.id), where('status', '==', 'open')); return r[0] || null; }
async function shiftData(shift) {
  const [sales, exps] = await Promise.all([qlist('sales', where('cashierId', '==', S.user.id), where('shiftId', '==', shift.id)), qlist('expenses', where('userId', '==', S.user.id), where('shiftId', '==', shift.id))]);
  sales.sort((a, b) => b.createdAt - a.createdAt); exps.sort((a, b) => b.createdAt - a.createdAt);
  return { sales, exps, totals: totalsFor(shift, sales, exps) };
}
function totalsFor(shift, sales, exps) {
  const sv = sales.filter((s) => !s.voided), ev = exps.filter((e) => !e.voided);
  const group = (arr, key) => { const m = {}; arr.forEach((x) => { m[x[key]] = (m[x[key]] || 0) + x.amount; }); return Object.entries(m).map(([method, total]) => ({ method, total: r2(total) })); };
  const cashSales = sv.filter((s) => isCash(s.method)).reduce((a, s) => a + s.amount, 0);
  const cashExp = ev.filter((e) => isCash(e.paidFrom)).reduce((a, e) => a + e.amount, 0);
  return { salesByMethod: group(sv, 'method'), expByMethod: group(ev, 'paidFrom'), salesTotal: r2(sv.reduce((a, s) => a + s.amount, 0)), expTotal: r2(ev.reduce((a, e) => a + e.amount, 0)), expectedCash: r2(shift.openingCash + cashSales - cashExp) };
}
function billing(minElapsed, rate, inc) { const m = Math.max(1, minElapsed); const billed = Math.ceil(m / inc) * inc; return { billed, amount: r2((billed / 60) * rate) }; }
const hms = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60].map((x) => pad(x)).join(':'); };

// ---------- admin: backup / restore / erase ----------
const BK_COLS = ['settings', 'branches', 'games', 'stations', 'users', 'shifts', 'sales', 'expenses', 'audit', 'photos'];
const toPlain = (v) => (v && typeof v.toMillis === 'function' ? { __ts: v.toMillis() } : Array.isArray(v) ? v.map(toPlain) : v && typeof v === 'object' ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, toPlain(x)])) : v);
const fromPlain = (v) => (Array.isArray(v) ? v.map(fromPlain) : v && typeof v === 'object' ? (Object.keys(v).length === 1 && '__ts' in v ? v.__ts : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, fromPlain(x)]))) : v);
async function buildBackup(includeFull) {
  const out = { app: 'gamezone', version: 2, createdAt: Date.now(), project: FIREBASE_CONFIG.projectId, collections: {} };
  for (const c of BK_COLS) { const s = await getDocs(query(C(c))); out.collections[c] = Object.fromEntries(s.docs.map((d) => [d.id, toPlain(d.data())])); }
  if (includeFull) { out.collections.photoData = {}; await inChunks(Object.keys(out.collections.photos), async (id) => { const d = await getDoc(D('photoData', id)); if (d.exists()) out.collections.photoData[id] = d.data(); }, 10); }
  return out;
}
const F2 = { sales: 'createdAt', expenses: 'createdAt', shifts: 'openedAt', photos: 'takenAt', audit: 'createdAt' };
async function erasePlan(mode, cutoff) {
  const plan = {};
  for (const c of mode === 'photos' ? ['photos'] : Object.keys(F2)) {
    let docs = mode === 'all' ? await qlist(c) : await qlist(c, where(F2[c], '<', cutoff));
    if (c === 'shifts') docs = docs.filter((d) => d.status === 'closed'); plan[c] = docs;
  }
  return plan;
}
async function adminData(main) {
  const last = S.cfg.lastBackupAt;
  const full = h('input', { type: 'checkbox', style: 'width:auto' });
  const bBtn = h('button', { class: 'btn primary', style: 'margin-top:12px' }, '⬇️ Download backup');
  bBtn.onclick = () => guarded(bBtn, async () => {
    const b = await buildBackup(full.checked); const n = Object.values(b.collections).reduce((a, c) => a + Object.keys(c).length, 0);
    downloadFile(`gamezone-backup-${ymd(new Date())}.json`, JSON.stringify(b), 'application/json');
    await updateDoc(D('settings', 'main'), { lastBackupAt: Date.now() }); S.cfg.lastBackupAt = Date.now(); toast(`Backup saved (${n} records)`); render();
  });
  const file = h('input', { type: 'file', accept: '.json,application/json' }); const rBtn = h('button', { class: 'btn', style: 'margin-top:12px' }, 'Restore from backup file');
  rBtn.onclick = () => guarded(rBtn, async () => {
    if (!file.files[0]) throw new Error('Choose a backup file first');
    let j; try { j = JSON.parse(await file.files[0].text()); } catch { throw new Error('This file is not a valid backup'); }
    if (!j || j.app !== 'gamezone' || !j.collections) throw new Error('This file is not a Game Zone backup');
    const cols = [...BK_COLS, 'photoData'].filter((c) => j.collections[c] && typeof j.collections[c] === 'object'); const n = cols.reduce((a, c) => a + Object.keys(j.collections[c]).length, 0);
    confirmBox('Restore this backup?', `${n} records from ${j.createdAt ? fmtDT(j.createdAt) : 'an unknown date'} will be written back. Records with the same ID are overwritten. Nothing else is deleted.`, 'Restore', async () => {
      for (const c of cols) await inChunks(Object.entries(j.collections[c]), ([id, data]) => setDoc(D(c, id), fromPlain(data)));
      await audit('restore_backup', `${n} records`); await loadStatic(); toast('Backup restored'); render();
    });
  });

  const mode = { v: 'photos' };
  const opt = (v, title, text) => h('label', {}, h('input', { type: 'radio', name: 'emode', value: v, checked: v === mode.v, onchange: () => { mode.v = v; cutRow.style.display = v === 'all' ? 'none' : ''; } }), h('span', {}, h('b', {}, title), h('div', { class: 'small muted' }, text)));
  const cut = h('input', { type: 'date', value: todayStr(-90) }); const cutRow = field('Delete records older than this date', cut);
  const keepFull = h('input', { type: 'checkbox', checked: true, style: 'width:auto' });
  const pw = h('input', { type: 'password', placeholder: 'Your admin password', autocomplete: 'current-password' }); const typed = h('input', { placeholder: 'Type ERASE' });
  const eBtn = h('button', { class: 'btn danger', style: 'margin-top:12px' }, '🗑️ Download backup and erase');
  eBtn.onclick = () => guarded(eBtn, async () => {
    if (typed.value.trim().toUpperCase() !== 'ERASE') throw new Error('Type ERASE to confirm');
    const u = auth.currentUser; try { await reauthenticateWithCredential(u, EmailAuthProvider.credential(u.email, pw.value)); } catch { throw new Error('Your password is wrong'); }
    if (mode.v !== 'photos' && (await qlist('shifts', where('status', '==', 'open'))).length) throw new Error('Close all open shifts first.');
    const cutoff = dayMs(cut.value || todayStr(-90)); const plan = await erasePlan(mode.v, cutoff);
    const summary = Object.entries(plan).filter(([, l]) => l.length).map(([c, l]) => `${l.length} ${c}`).join(', ');
    if (!summary) throw new Error('Nothing to erase for these settings.');
    confirmBox('Erase permanently?', `This will delete: ${summary}. A backup file downloads first so you can restore it later.`, 'Download backup and erase', async () => {
      const bk = { app: 'gamezone', version: 2, partial: true, createdAt: Date.now(), project: FIREBASE_CONFIG.projectId, collections: {} };
      for (const [c, l] of Object.entries(plan)) bk.collections[c] = Object.fromEntries(l.map(({ id, ...rest }) => [id, toPlain(rest)]));
      if (plan.photos && plan.photos.length && keepFull.checked) { bk.collections.photoData = {}; await inChunks(plan.photos, async (p) => { const d = await getDoc(D('photoData', p.id)); if (d.exists()) bk.collections.photoData[p.id] = d.data(); }, 10); }
      downloadFile(`gamezone-erased-${ymd(new Date())}.json`, JSON.stringify(bk), 'application/json');
      for (const [c, l] of Object.entries(plan)) await inChunks(l, (d) => deleteDoc(D(c, d.id)));
      if (plan.photos) await inChunks(plan.photos, (p) => deleteDoc(D('photoData', p.id)));
      await audit('erase_data', `${mode.v}: ${summary}`); toast('Data erased'); render();
    }, true);
  });

  main.replaceChildren(
    h('div', { class: 'grid g2' },
      h('div', { class: 'card' }, h('h2', {}, '💾 Backup'), h('p', { class: 'muted small' }, 'Downloads all your records (sales, expenses, shifts, staff, games, settings, photo thumbnails) as one file. Keep it somewhere safe, for example Google Drive or a flash disk. Do this every week.'),
        h('p', {}, h('b', {}, 'Last backup: '), last ? fmtDT(last) : 'never'), h('label', { class: 'row', style: 'text-transform:none;letter-spacing:0;font-size:.9rem' }, full, ' Include full-size photos (bigger file)'), bBtn),
      h('div', { class: 'card' }, h('h2', {}, '♻️ Restore'), h('p', { class: 'muted small' }, 'Put back records from a backup file made by this system. Nothing is deleted; matching records are overwritten.'), field('Backup file', file), rBtn)),
    h('div', { class: 'card' }, h('h2', {}, '🗑️ Erase old data'), h('p', { class: 'muted small' }, 'Frees space and keeps the system fast. Branches, games, machines, staff logins and settings are never erased. To remove a single wrong sale use Void instead, which keeps the audit trail.'),
      h('div', { class: 'seg' }, opt('photos', 'Photos only', 'Delete photos older than the date. Money records stay.'), opt('old', 'Everything older than the date', 'Sales, expenses, closed shifts, photos and activity log older than the date.'), opt('all', 'Fresh start', 'Delete ALL sales, expenses, shifts, photos and activity log.')),
      cutRow, h('label', { class: 'row', style: 'text-transform:none;letter-spacing:0;font-size:.9rem' }, keepFull, ' Put full-size photos in the backup file too'),
      h('div', { class: 'grid g2' }, field('Your password', pw), field('Safety word', typed)), eBtn));
}
